name: Deploy Frontend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'Frontend and UI/**'

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Render secrets not configured. Skipping deploy."; exit 0
          fi
          echo "Triggering Render deploy for service: $RENDER_SERVICE_ID"
          curl -s -X POST "https://api.render.com/deploy/srv-$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" | jq || true
