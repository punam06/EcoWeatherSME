name: Deploy Backend to Supabase

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - 'backend/**'
      - 'lib/**'
  workflow_dispatch: {}

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Supabase secrets
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF missing. Skipping Supabase deploy.";
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase login
        if: steps.check.outputs.skip == 'false'
        run: |
          supabase login
          
      - name: Link Supabase project
        if: steps.check.outputs.skip == 'false'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy Supabase Edge Functions
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "Deploying functions under supabase/functions/ to project ref from secrets"
          for fn in supabase/functions/*; do
            if [ -d "$fn" ]; then
              fname=$(basename "$fn")
              echo "Deploying function: $fname"
              supabase functions deploy "$fname" || { echo "deploy failed for $fname"; exit 1; }
            fi
          done

      - name: Note when skipped
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Supabase deploy skipped because required GitHub secrets are not configured. See DEPLOYMENT_NOTES.md for details."
