name: Deploy Backend to Supabase

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - 'backend/**'
      - 'lib/**'
  workflow_dispatch: {}

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Supabase secrets
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF missing. Skipping Supabase deploy.";
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase login
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy Supabase Edge Functions
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for fn in supabase/functions/*; do
            if [ -d "$fn" ]; then
              fname=$(basename "$fn")
              if [[ "$fname" == _* ]]; then
                echo "Skipping helper/shared folder: $fname"
                continue
              fi
              echo "Deploying function: $fname"
              supabase functions deploy "$fname" --project-ref "$SUPABASE_PROJECT_REF" || { echo "deploy failed for $fname"; exit 1; }
            fi
          done

      - name: Note when skipped
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Supabase deploy skipped because required GitHub secrets are not configured. See DEPLOYMENT_NOTES.md for details."
