  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

  <!-- React + Babel (browser) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: rgba(16,185,129,0.3); color: #fff; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.5); }

    /* ── Range Sliders ── */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: var(--gauge-track);
      border-radius: 6px;
      outline: none;
      height: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      box-shadow: 0 0 10px rgba(16,185,129,0.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
    }

    /* ── Animations ── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(16,185,129,0.25); }
      50% { box-shadow: 0 0 20px rgba(16,185,129,0.5); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ── Buttons Reset ── */
    button {
      font-family: inherit;
      border: none;
      outline: none;
    }
    button:focus-visible {
      outline: 2px solid #10B981;
      outline-offset: 2px;
    }
  </style>
</head>

    /* ═══════════════════════════════════════════════════════════════
       CALCULATION ENGINES
       ═══════════════════════════════════════════════════════════════ */
    function calcTrustScore({ pH, EC, temp, ratio, days }) {
      let score = 100;
      score -= Math.abs(pH - 4.0) * 8;
      score -= Math.abs(EC - 3.5) * 6;
      score -= Math.abs(temp - 28) * 1.2;
      const ratioMap = { "1:1:10": -5, "1:1:20": 0, "1:1:30": -3, "1:1:40": -8 };
      score += ratioMap[ratio] ?? 0;
      if (days < 7) score -= (7 - days) * 4;
      else if (days > 14) score -= (days - 14) * 2;
      return Math.max(0, Math.min(100, Math.round(score)));
    }

    function getSolarFactor(hour) {
      if (hour >= 11 && hour < 15) return 1.0;
      if ((hour >= 8 && hour < 11) || (hour >= 15 && hour < 18)) return 0.6;
      return 0.2;
    }

    function getSolarHourMultiplier(hour) {
      if (hour >= 11 && hour < 15) return 1.5;
      if ((hour >= 8 && hour < 11) || (hour >= 15 && hour < 18)) return 1.0;
      return 0.4;
    }

    function calcAdjustedTemp(baseTemp, zone, hour, windSpeed) {
      const uhi = UHI_ZONES[zone];
      return baseTemp + (uhi.offset * getSolarFactor(hour)) - (windSpeed > 15 ? 1.0 : 0.0);
    }

    function calcThermalRisk(adjTemp) {
      if (adjTemp > 35) return { value: 1.0, label: "Critical", color: A.red };
      if (adjTemp > 32) return { value: 0.5, label: "Moderate", color: A.amber };
      return { value: 0.1, label: "Low", color: A.green };
    }

    function calcDVS(trustScore, adjTemp) {
      const trf = adjTemp > 38 ? 1.0 : adjTemp > 35 ? 0.5 : 0.1;
      return Math.max(0, Math.min(100, Math.round(trustScore * (1 - trf * 0.42))));
    }

    function calcTST(trustScore, zone, packaging, hour) {
      const uhi = UHI_ZONES[zone];
      const pkgFactor = packaging === "thermal" ? 4.0 : packaging === "insulated" ? 2.0 : 1.0;
      const solarMulti = getSolarHourMultiplier(hour);
      return Math.max(10, Math.round((trustScore * pkgFactor * uhi.baseSurvival) / (uhi.hazardMultiplier * solarMulti) * 60));
    }

    /* ═══════════════════════════════════════════════════════════════
       REUSABLE COMPONENTS
       ═══════════════════════════════════════════════════════════════ */

    function GaugeArc({ value, max = 100, color, size = 140, strokeWidth = 10 }) {
      const r = (size - strokeWidth * 2) / 2;
      const circ = Math.PI * r;
      const dash = circ * Math.min(value / max, 1);
      return (
        <svg width={size} height={size / 2 + strokeWidth} viewBox={`0 0 ${size} ${size / 2 + strokeWidth}`} style={{ overflow: "visible" }}>
          <path d={`M ${strokeWidth} ${size/2} A ${r} ${r} 0 0 1 ${size-strokeWidth} ${size/2}`}
            fill="none" stroke="var(--gauge-track)" strokeWidth={strokeWidth} strokeLinecap="round" />
          <path d={`M ${strokeWidth} ${size/2} A ${r} ${r} 0 0 1 ${size-strokeWidth} ${size/2}`}
            fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"
            strokeDasharray={`${dash} ${circ}`}
            style={{ transition: "stroke-dasharray 0.6s cubic-bezier(0.4,0,0.2,1), stroke 0.4s ease" }} />
        </svg>
      );
    }

    function ScoreGauge({ value, label, size = 140 }) {
      const color = value >= 75 ? A.green : value >= 55 ? A.amber : A.red;
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          <div style={{ position: "relative", width: size, height: size / 2 + 20 }}>
            <GaugeArc value={value} color={color} size={size} />
            <div style={{ position: "absolute", bottom: 0, left: "50%", transform: "translateX(-50%)", textAlign: "center" }}>
              <div style={{ fontSize: size * 0.22, fontWeight: 700, color, lineHeight: 1, fontFamily: "'JetBrains Mono', monospace", transition: "color 0.4s" }}>{value}</div>
              <div style={{ fontSize: 9, color: "var(--text-dim)", marginTop: 2 }}>/ 100</div>
            </div>
          </div>
          <div style={{ fontSize: 9, color: "var(--text-muted)", letterSpacing: "0.12em", textTransform: "uppercase", fontWeight: 600 }}>{label}</div>
        </div>
      );
    }

    function StatusBadge({ value, type = "dvs" }) {
      const isTS = type === "trust";
      const safe = isTS ? value >= 80 : value >= 75;
      const caution = isTS ? value >= 60 : value >= 55;
      const [bg, text, label] = safe
        ? [A.greenBg, A.green, "SAFE"]
        : caution
        ? [A.amberBg, A.amber, "CAUTION"]
        : [A.redBg, A.red, "HIGH RISK"];
      return (
        <span style={{
          background: bg, color: text, border: `1px solid ${text}33`, borderRadius: 20,
          padding: "4px 14px", fontSize: 10, fontWeight: 700, letterSpacing: "0.1em",
          transition: "all 0.3s ease", display: "inline-block",
        }}>{label}</span>
      );
    }

    function Card({ children, style = {} }) {
      const [hovered, setHovered] = useState(false);
      return (
        <div
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}

            backdropFilter: "var(--backdrop-blur)",
            WebkitBackdropFilter: "var(--backdrop-blur)",
            borderRadius: 16, padding: 22,
            border: `1px solid ${hovered ? "var(--border-hover)" : "var(--border-primary)"}`,
            boxShadow: hovered ? "var(--shadow-hover)" : "var(--shadow-card)",
            transition: "all 0.4s cubic-bezier(0.4,0,0.2,1)",
            transform: hovered ? "translateY(-2px)" : "none",
            ...style,
          }}
        >{children}</div>
      );
    }

    function SliderRow({ label, min, max, step = 0.1, value, onChange, unit = "", color = A.green }) {
      return (
        <div style={{ marginBottom: 16 }}>

            style={{ width: "100%", accentColor: color }} />

            <span>{min}{unit}</span><span>{max}{unit}</span>
          </div>

    }

      return (

          </div>
          <div style={{ fontSize: 15, fontWeight: 700, color, fontFamily: "'JetBrains Mono', monospace" }}>{value}</div>

    }

    function ThemeToggle({ theme, onToggle }) {
      return (
        <button id="theme-toggle" onClick={onToggle} aria-label="Toggle theme"
          style={{
            width: 42, height: 42, borderRadius: 12,
            border: "1px solid var(--border-primary)",
            background: "var(--bg-input)", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 19,
            transition: "all 0.5s cubic-bezier(0.4,0,0.2,1)",
            transform: `rotate(${theme === "dark" ? 0 : 180}deg)`,
          }}>
          {theme === "dark" ? "🌙" : "☀️"}
        </button>
      );
    }
    function ZoneSearchSelect({ value, onChange }) {
      const [query, setQuery] = useState("");
      const [open, setOpen] = useState(false);
      const wrapRef = useRef(null);
      const inputRef = useRef(null);

      const allZones = Object.keys(UHI_ZONES);
      const filtered = query.trim()
        ? allZones.filter(z => z.toLowerCase().includes(query.toLowerCase()))
        : allZones;

      const selected = UHI_ZONES[value];

      useEffect(() => {
        function handleClick(e) {
          if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener("mousedown", handleClick);
        return () => document.removeEventListener("mousedown", handleClick);
      }, []);

      return (
        <div ref={wrapRef} style={{ position: "relative", marginBottom: 16 }}>
          <div style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 8, fontWeight: 500 }}>Delivery Zone</div>

          {/* Selected zone display / trigger */}
          <button onClick={() => { setOpen(!open); setTimeout(() => inputRef.current?.focus(), 50); }}
            style={{
              width: "100%", padding: "10px 12px", borderRadius: 10, cursor: "pointer",
              border: `1px solid ${open ? A.green : selected?.color || "var(--border-primary)"}`,
              background: open ? A.greenBg : (selected ? selected.color + "10" : "var(--bg-input)"),
              color: selected?.color || "var(--text-muted)",
              fontSize: 12, textAlign: "left", transition: "all 0.25s ease",
              display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
            <div>
              <div style={{ fontWeight: 600, marginBottom: 2 }}>{value}</div>
              <div style={{ fontSize: 9, opacity: 0.8 }}>+{selected?.offset}°C · Class {selected?.hazardClass} · Hazard ×{selected?.hazardMultiplier}</div>
            </div>
            <span style={{ fontSize: 10, color: "var(--text-dim)", transition: "transform 0.2s", transform: open ? "rotate(180deg)" : "none" }}>▼</span>
          </button>

          {/* Dropdown */}
          {open && (
            <div style={{
              position: "absolute", top: "100%", left: 0, right: 0, zIndex: 100,
              marginTop: 4, borderRadius: 12, overflow: "hidden",
              background: "var(--bg-card)", backdropFilter: "var(--backdrop-blur)",
              WebkitBackdropFilter: "var(--backdrop-blur)",
              border: "1px solid var(--border-hover)",
              boxShadow: "var(--shadow-hover)",
              animation: "fadeSlideIn 0.2s ease",
            }}>
              {/* Search input */}
              <div style={{ padding: "8px 10px", borderBottom: "1px solid var(--border-primary)" }}>
                <input ref={inputRef} type="text" placeholder="Search zone..." value={query}
                  onChange={e => setQuery(e.target.value)}
                  style={{
                    width: "100%", padding: "8px 10px", borderRadius: 8, fontSize: 12,
                    border: "1px solid var(--border-primary)", background: "var(--bg-input)",
                    color: "var(--text-primary)", outline: "none", fontFamily: "inherit",
                  }} />
              </div>
              {/* Results */}
              <div style={{ maxHeight: 240, overflowY: "auto" }}>
                {filtered.length === 0 && (
                  <div style={{ padding: "14px", textAlign: "center", fontSize: 11, color: "var(--text-dim)" }}>No zones found</div>
                )}
                {filtered.map(z => {
                  const d = UHI_ZONES[z];
                  const isActive = z === value;
                  return (
                    <button key={z}
                      onClick={() => { onChange(z); setOpen(false); setQuery(""); }}
                      style={{
                        width: "100%", padding: "9px 12px", cursor: "pointer",
                        background: isActive ? d.color + "15" : "transparent",
                        color: isActive ? d.color : "var(--text-secondary)",
                        fontSize: 11, textAlign: "left",
                        borderBottom: "1px solid var(--border-primary)",
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        transition: "background 0.15s ease",
                      }}
                      onMouseEnter={e => e.currentTarget.style.background = d.color + "12"}
                      onMouseLeave={e => e.currentTarget.style.background = isActive ? d.color + "15" : "transparent"}
                    >
                      <span style={{ fontWeight: isActive ? 600 : 400 }}>{z}</span>
                      <span style={{ fontSize: 9, color: d.color, fontFamily: "'JetBrains Mono', monospace" }}>
                        +{d.offset}°C · {d.hazardClass}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════

    function IoTForm({ onResult }) {

      const ts = calcTrustScore({ pH, EC, temp, ratio, days });
      useEffect(() => { onResult(ts); setCertified(false); }, [pH, EC, temp, ratio, days]);

      return (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 20 }}>
            <div>
              <SliderRow label="pH Level" min={3.0} max={7.0} step={0.1} value={pH} onChange={setPH} color={A.green} />
              <div style={{ fontSize: 10, color: "var(--text-dim)", marginTop: -10 }}>Optimal: 3.8–4.2</div>

            <div>
              <SliderRow label="Conductivity (EC)" min={1.0} max={6.0} step={0.1} value={EC} onChange={setEC} unit=" mS/cm" color={A.green} />
              <div style={{ fontSize: 10, color: "var(--text-dim)", marginTop: -10 }}>Optimal: 3.1–3.9 mS/cm</div>
            </div>
            <div>
              <SliderRow label="Storage Temperature" min={20} max={45} step={0.5} value={temp} onChange={setTemp} unit="°C" color={temp > 35 ? A.red : A.amber} />
              <div style={{ fontSize: 10, color: "var(--text-dim)", marginTop: -10 }}>Optimal: 25–32°C</div>
            </div>
            <div>
              <div style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 8, fontWeight: 500 }}>Treatment Ratio</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {["1:1:10", "1:1:20", "1:1:30", "1:1:40"].map(v => (
                  <button key={v} onClick={() => setRatio(v)}
                    style={{
                      padding: "8px 4px", borderRadius: 8, cursor: "pointer",
                      border: `1px solid ${ratio === v ? A.green : "var(--border-primary)"}`,
                      background: ratio === v ? A.greenBg : "var(--bg-input)",
                      color: ratio === v ? A.green : "var(--text-muted)",
                      fontSize: 11, fontFamily: "'JetBrains Mono', monospace",
                      fontWeight: ratio === v ? 600 : 400, transition: "all 0.25s ease",
                    }}>{v}</button>
                ))}
              </div>
            </div>
            <div style={{ gridColumn: "1 / -1" }}>

              border: `1px solid ${ts >= 60 ? A.green : "var(--border-primary)"}`,
              background: ts >= 60 ? `linear-gradient(135deg, ${A.greenBg}, rgba(16,185,129,0.15))` : "var(--bg-input)",
              color: ts >= 60 ? A.green : "var(--text-dim)",
              fontSize: 13, fontWeight: 600, letterSpacing: "0.04em", transition: "all 0.3s ease",
            }}>
            {ts >= 60 ? "✦ Certify Batch & Generate QR Certificate" : "Trust Score too low to certify"}

              <div style={{ fontSize: 12, color: A.green, fontWeight: 700, marginBottom: 12 }}>✓ BATCH CERTIFIED — Certificate Generated</div>
              <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>

                  width: 58, height: 58, background: "var(--bg-input)", borderRadius: 10,

                  <div><span style={{ color: A.green, fontWeight: 600 }}>Trust Score:</span> {ts}/100</div>
                  <div><span style={{ color: A.green, fontWeight: 600 }}>pH / EC / Temp:</span> {pH} / {EC} / {temp}°C</div>

    /* ═══════════════════════════════════════════════════════════════
       TAB 2: MICROCLIMATE INTELLIGENCE
       ═══════════════════════════════════════════════════════════════ */
    function DispatchCalendar({ baseTemp, zone, trustScore, windSpeed }) {
      const hours = Array.from({ length: 24 }, (_, h) => {
        const adj = calcAdjustedTemp(baseTemp, zone, h, windSpeed);
        const dvs = calcDVS(trustScore, adj);
        return { h, dvs };
      });
      return (
        <div style={{ marginTop: 16 }}>
          <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 8, fontWeight: 500 }}>24-Hour Dispatch Safety Window</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(24, 1fr)", gap: 2, height: 38 }}>
            {hours.map(({ h, dvs }) => {
              const col = dvs >= 75 ? A.green : dvs >= 55 ? A.amber : A.red;
              return (
                <div key={h} title={`${String(h).padStart(2,'0')}:00 — DVS ${dvs}`}
                  style={{
                    background: col + "30", border: `1px solid ${col}50`, borderRadius: 4,
                    cursor: "default", transition: "all 0.3s ease",
                  }} />
              );
            })}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "var(--text-dim)", marginTop: 5 }}>
            {[0,6,12,18,23].map(h => <span key={h}>{String(h).padStart(2,'0')}:00</span>)}
          </div>
          <div style={{ display: "flex", gap: 16, marginTop: 10, fontSize: 11 }}>
            {[[A.green,"Safe (≥75)"],[A.amber,"Caution (55–74)"],[A.red,"Risk (<55)"]].map(([c,l]) => (
              <span key={l} style={{ display: "flex", alignItems: "center", gap: 5, color: "var(--text-muted)" }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: c }}></span>{l}
              </span>
            ))}
          </div>
        </div>
      );
    }

    function MERMPipelinePanel({ baseTemp, zone, hour, windSpeed }) {
      const uhi = UHI_ZONES[zone];
      const solarFactor = getSolarFactor(hour);
      const windCooling = windSpeed > 15 ? 1.0 : 0.0;
      const uhiContrib = uhi.offset * solarFactor;
      const adjTemp = calcAdjustedTemp(baseTemp, zone, hour, windSpeed);
      const risk = calcThermalRisk(adjTemp);

      const steps = [
        { label: "Base Temperature", value: `${baseTemp.toFixed(1)}°C`, color: "var(--text-primary)", op: "" },
        { label: `UHI Offset (${zone})`, value: `${uhi.offset}°C × ${solarFactor}`, color: A.amber, op: "+" },
        { label: "UHI Contribution", value: `+${uhiContrib.toFixed(1)}°C`, color: A.amber, op: "=" },
        { label: "Wind Cooling", value: `−${windCooling.toFixed(1)}°C`, color: A.blue, op: "−" },
        { label: "Adjusted Temperature", value: `${adjTemp.toFixed(1)}°C`, color: risk.color, op: "═", isBold: true },
        { label: "Thermal Risk Index", value: `${risk.label} (${risk.value})`, color: risk.color, op: "→", isBold: true },
      ];

      return (
        <div style={{
          padding: 16, borderRadius: 12,
          background: "var(--bg-input)", border: "1px solid var(--border-primary)",
        }}>
          <div style={{ fontSize: 10, color: A.green, fontWeight: 700, marginBottom: 12, letterSpacing: "0.1em" }}>
            MERM CALCULATION PIPELINE
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
            {steps.map((s, i) => (
              <div key={i} style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                padding: "6px 0",
                borderTop: (i === 4) ? "1px dashed var(--border-hover)" : "none",
                marginTop: (i === 4) ? 4 : 0, paddingTop: (i === 4) ? 10 : 6,
              }}>
                <span style={{
                  fontSize: 11, color: "var(--text-muted)", fontWeight: s.isBold ? 600 : 400,
                  display: "flex", alignItems: "center", gap: 6,
                }}>
                  {s.op && <span style={{
                    width: 18, height: 18, borderRadius: 4, background: s.color + "15",
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    fontSize: 10, color: s.color, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace",
                  }}>{s.op}</span>}
                  {s.label}
                </span>
                <span style={{
                  fontSize: s.isBold ? 14 : 12, fontWeight: 700, color: s.color,
                  fontFamily: "'JetBrains Mono', monospace",
                }}>{s.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function MicroclimateSimulator({ trustScore }) {
      const [baseTemp, setBaseTemp] = useState(31);
      const [zone, setZone] = useState("Mirpur");
      const [packaging, setPackaging] = useState("standard");
      const [hour, setHour] = useState(12);
      const [windSpeed, setWindSpeed] = useState(8);
      const [isFetching, setIsFetching] = useState(false);

      useEffect(() => {
        setIsFetching(true);
        // Simulate auto-fetching API delay
        const timer = setTimeout(() => {
          // Deterministic values based on zone string to simulate varying weather per location
          const hash = zone.charCodeAt(0) + zone.length;
          setBaseTemp(29 + (hash % 7) + (hash % 3) * 0.5); 
          setWindSpeed(4 + (hash % 12));
          setIsFetching(false);
        }, 600);
        return () => clearTimeout(timer);
      }, [zone]);

      const adjTemp = calcAdjustedTemp(baseTemp, zone, hour, windSpeed);
      const risk = calcThermalRisk(adjTemp);
      const dvs = calcDVS(trustScore, adjTemp);
      const tst = calcTST(trustScore, zone, packaging, hour);
      const uhi = UHI_ZONES[zone];
      const dvsColor = dvs >= 75 ? A.green : dvs >= 55 ? A.amber : A.red;

      const solarLabel = hour >= 11 && hour < 15 ? "Peak Solar" : (hour >= 8 && hour < 18) ? "Daylight" : "Night";

      const advice = dvs >= 75
        ? `${zone} zone — DVS ${dvs} is SAFE. Adjusted temp ${adjTemp.toFixed(1)}°C. Heat-sensitive products (cosmetics, food, medicine) can be dispatched safely. Thermal Survival: ${tst} min.`
        : dvs >= 55
        ? `CAUTION in ${zone} at ${adjTemp.toFixed(1)}°C. Perishable goods and liquid medicines should be dispatched before 08:00 AM only. TST: ${tst} min. Consider insulated packaging for organics and cosmetics.`
        : `HIGH RISK: ${zone} at ${adjTemp.toFixed(1)}°C. TST only ${tst} min. Delay dispatch of all heat-sensitive items or upgrade to thermal-insulated bins. Food, cosmetics, and medicines are at degradation risk.`;

      return (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 28 }}>
            {/* LEFT: Controls */}
            <div>
              <ZoneSearchSelect value={zone} onChange={setZone} />

              <div style={{
                marginBottom: 16, padding: "10px 12px", borderRadius: 10,
                background: "var(--bg-input)", border: "1px solid var(--border-primary)",
                display: "flex", justifyContent: "space-between", alignItems: "center",
                opacity: isFetching ? 0.5 : 1, transition: "opacity 0.3s ease"
              }}>
                <div>
                  <div style={{ fontSize: 10, color: "var(--text-dim)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4, fontWeight: 600 }}>Auto-Detected Weather</div>
                  <div style={{ display: "flex", gap: 14, fontSize: 14, fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: "var(--text-primary)" }}>
                    <span>🌡️ {baseTemp.toFixed(1)}°C</span>
                    <span>💨 {windSpeed} km/h</span>
                  </div>
                </div>
                {isFetching && <div style={{ fontSize: 11, color: A.blue, fontWeight: 600, animation: "breathe 1s infinite" }}>FETCHING...</div>}
              </div>

              <SliderRow label={`Dispatch Hour (${solarLabel})`} min={0} max={23} step={1} value={hour} onChange={setHour}
                unit=":00" color={hour >= 11 && hour < 15 ? A.red : hour >= 8 && hour < 18 ? A.amber : A.green} />

              <div style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 8, fontWeight: 500 }}>Packaging Type</div>
              <div style={{ display: "flex", gap: 6 }}>
                {[["standard","Standard"],["insulated","Insulated"],["thermal","Thermal Bin"]].map(([v,l]) => (
                  <button key={v} onClick={() => setPackaging(v)}
                    style={{
                      flex: 1, padding: "9px 4px", borderRadius: 10, cursor: "pointer",
                      border: `1px solid ${packaging === v ? A.green : "var(--border-primary)"}`,
                      background: packaging === v ? A.greenBg : "var(--bg-input)",
                      color: packaging === v ? A.green : "var(--text-muted)",
                      fontSize: 10, fontWeight: packaging === v ? 600 : 400, transition: "all 0.25s ease",
                    }}>{l}</button>
                ))}
              </div>
            </div>

            {/* RIGHT: Results */}
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
              {/* DVS Gauge */}
              <div style={{ position: "relative", marginBottom: 4 }}>
                <svg width={180} height={112} viewBox="0 0 180 112">
                  <path d="M 14 100 A 76 76 0 0 1 166 100" fill="none" stroke="var(--gauge-track)" strokeWidth={14} strokeLinecap="round" />
                  <path d="M 14 100 A 76 76 0 0 1 166 100" fill="none" stroke={dvsColor} strokeWidth={14} strokeLinecap="round"
                    strokeDasharray={`${(dvs/100) * Math.PI * 76} ${Math.PI * 76}`}
                    style={{ transition: "stroke-dasharray 0.6s cubic-bezier(0.4,0,0.2,1), stroke 0.4s ease" }} />
                  <text x="90" y="85" textAnchor="middle" fill={dvsColor} fontSize="30" fontWeight="700"
                    fontFamily="'JetBrains Mono', monospace" style={{ transition: "fill 0.4s" }}>{dvs}</text>
                  <text x="90" y="102" textAnchor="middle" fill="var(--text-dim)" fontSize="9" fontWeight="500" letterSpacing="1.5">DELIVERY VIABILITY</text>
                </svg>
                <div style={{ position: "absolute", top: -4, right: -4 }}>
                  <StatusBadge value={dvs} type="dvs" />
                </div>
              </div>

              {/* MERM Pipeline */}
              <MERMPipelinePanel baseTemp={baseTemp} zone={zone} hour={hour} windSpeed={windSpeed} />

              {/* Key Metrics */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, width: "100%" }}>
                <MetricBox label="Thermal Survival" value={`${tst} min`} color={tst < 30 ? A.red : tst < 60 ? A.amber : A.green} icon="⏱" />
                <MetricBox label="Hazard Multiplier" value={`×${uhi.hazardMultiplier}`} color={uhi.color} icon="⚡" />
                <MetricBox label="Solar Factor" value={`×${getSolarFactor(hour)}`} color={hour >= 11 && hour < 15 ? A.red : hour >= 8 && hour < 18 ? A.amber : A.green} icon="☀" />
                <MetricBox label="Zone Class" value={`Class ${uhi.hazardClass}`} color={uhi.color} icon="📍" />
              </div>
            </div>
          </div>

          {/* Advisory */}
          <div style={{
            marginTop: 18, padding: 16, borderRadius: 12,
            border: `1px solid ${dvsColor}30`, background: dvsColor + "08",
            transition: "all 0.4s ease",
          }}>
            <div style={{ fontSize: 12, color: dvsColor, fontWeight: 700, marginBottom: 6 }}>
              {dvs >= 75 ? "✓ Smart Dispatch Advice" : dvs >= 55 ? "⚠ Smart Dispatch Advice" : "✕ High Risk Advisory"}
            </div>
            <div style={{ fontSize: 12, color: "var(--text-primary)", lineHeight: 1.8 }}>{advice}</div>
          </div>

          <DispatchCalendar baseTemp={baseTemp} zone={zone} trustScore={trustScore} windSpeed={windSpeed} />
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       TAB 3: CLIMATE DEMAND INTELLIGENCE
       ═══════════════════════════════════════════════════════════════ */
    function DemandChart({ theme }) {
      const canvasRef = useRef();
      const chartRef = useRef();

      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext("2d");
        const labels = Array.from({ length: 30 }, (_, i) => {
          const d = new Date(); d.setDate(d.getDate() + i);
          return `${d.getDate()}/${d.getMonth() + 1}`;
        });
        const base = [42,38,45,40,37,43,48,52,55,58,62,78,95,110,118,105,88,75,68,65,70,72,68,66,64,60,58,55,52,50];

        const gridColor = theme === "dark" ? "#1E293B" : "#E2E8F0";
        const tickColor = theme === "dark" ? "#64748B" : "#94A3B8";

        chartRef.current = new window.Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "Demand Forecast",
              data: base,
              borderColor: A.green,
              backgroundColor: "rgba(16,185,129,0.06)",
              borderWidth: 2, fill: true, tension: 0.4,
              pointRadius: base.map((v,i) => i === 11 ? 7 : 0),
              pointBackgroundColor: base.map((v,i) => i === 11 ? A.amber : A.green),
              pointBorderColor: base.map((v,i) => i === 11 ? A.amber : A.green),
              pointBorderWidth: 2,
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: { label: ctx => ` ${ctx.parsed.y} units` },
                backgroundColor: theme === "dark" ? "#111827" : "#FFFFFF",
                titleColor: A.green, bodyColor: theme === "dark" ? "#F1F5F9" : "#0F172A",
                borderColor: theme === "dark" ? "#1E293B" : "#E2E8F0", borderWidth: 1,
                cornerRadius: 8, padding: 10,
              },
            },
            scales: {
              x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 9, family: "Inter" }, maxRotation: 45, autoSkip: true, maxTicksLimit: 8 } },
              y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10, family: "Inter" } } },
            },
          },
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [theme]);

      return (
        <div>
          <div style={{ display: "flex", gap: 14, marginBottom: 16, flexWrap: "wrap" }}>
            {[
              [A.amber, "Heatwave event (+40% demand spike)"],
              [A.green, "Demand forecast (Prophet ML)"],
            ].map(([c,l]) => (
              <span key={l} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: "var(--text-muted)" }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: c, flexShrink: 0 }}></span>{l}
              </span>
            ))}
          </div>
          <div style={{ position: "relative", width: "100%", height: 210 }}>
            <canvas ref={canvasRef} role="img" aria-label="30-day demand forecast chart">30-day demand forecast</canvas>
          </div>
          <div style={{
            marginTop: 16, padding: 16, borderRadius: 12,
            border: `1px solid ${A.amberBorder}`, background: A.amberBg,
            display: "flex", gap: 14, alignItems: "flex-start",
          }}>
            <span style={{ fontSize: 22 }}>⚡</span>
            <div>
              <div style={{ fontSize: 12, color: A.amber, fontWeight: 700 }}>Climate Demand Alert</div>
              <div style={{ fontSize: 11, color: "var(--text-secondary)", marginTop: 5, lineHeight: 1.7 }}>
                Heatwave forecast in 5 days → expect +40% demand for cold-chain sensitive products (cosmetics, organic supplements, food, and medicines). Prepare additional inventory and upgrade packaging for perishable goods.
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       TAB 4: IMPACT & ESG
       ═══════════════════════════════════════════════════════════════ */
    function ESGCard({ trustScore, dvs }) {
      const spoilagePrevented = Math.round(trustScore * 2.1 * (dvs / 100) * 40);
      const plasticOffset = Math.round(trustScore * 0.8);
      const carbonSeq = Math.round(trustScore * 1.4);
      return (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
          {[
            ["🛡️", "Spoilage Prevented", `BDT ${spoilagePrevented.toLocaleString()}`, A.green],
            ["♻️", "Plastic Offset", `${plasticOffset} kg`, A.green],
            ["🌿", "Carbon Sequestered", `${carbonSeq} kg CO₂`, A.green],
          ].map(([icon, l, v, c]) => (
            <Card key={l} style={{ textAlign: "center", padding: "18px 12px" }}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>{icon}</div>
              <div style={{ fontSize: 10, color: "var(--text-dim)", marginBottom: 8, lineHeight: 1.5, fontWeight: 500 }}>{l}</div>
              <div style={{ fontSize: 17, fontWeight: 700, color: c, fontFamily: "'JetBrains Mono', monospace" }}>{v}</div>
            </Card>
          ))}
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       MAIN APP
       ═══════════════════════════════════════════════════════════════ */
    const TABS = [
      { label: "Batch Verification", icon: "📡" },
      { label: "Microclimate Intelligence", icon: "🌡️" },
      { label: "Climate Demand", icon: "📊" },
      { label: "Impact & ESG", icon: "🌱" },
    ];

    function EcoSorthaApp() {
      const [tab, setTab] = useState(0);
      const [trustScore, setTrustScore] = useState(84);
      const [theme, setTheme] = useState("dark");

      const adjTemp = calcAdjustedTemp(31, "Mirpur", 12, 8);
      const dvs = calcDVS(trustScore, adjTemp);
      const themeVars = THEMES[theme];

      return (
        <div id="app-root" style={{
          ...themeVars,
          background: "var(--bg-primary)",
          minHeight: "100vh",
          fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          color: "var(--text-primary)",
          transition: "background 0.5s cubic-bezier(0.4,0,0.2,1), color 0.4s ease",
        }}>

          {/* ── HEADER ── */}
          <header style={{
            borderBottom: "1px solid var(--border-primary)",
            padding: "14px 28px",
            display: "flex", alignItems: "center", justifyContent: "space-between",
            background: "var(--bg-header)",
            backdropFilter: "var(--backdrop-blur)", WebkitBackdropFilter: "var(--backdrop-blur)",
            position: "sticky", top: 0, zIndex: 50,
            backgroundImage: `linear-gradient(to right, ${A.green}06, transparent 40%)`,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{
                width: 38, height: 38, borderRadius: 11,
                background: `linear-gradient(135deg, ${A.greenLight}, ${A.greenDark})`,
                display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19,
                animation: "pulseGlow 3s ease-in-out infinite",
              }}>🌱</div>
              <div>
                <div style={{ fontSize: 16, fontWeight: 700, color: "var(--text-primary)", letterSpacing: "-0.02em" }}>EcoSortha AI</div>
                <div style={{ fontSize: 9, color: "var(--text-dim)", letterSpacing: "0.16em", fontWeight: 500 }}>CLIMATESHIELD · SME DASHBOARD</div>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
              <div style={{ display: "flex", gap: 12 }}>
                <ScoreGauge value={trustScore} label="Trust" size={72} />
                <ScoreGauge value={dvs} label="DVS" size={72} />
              </div>
              <ThemeToggle theme={theme} onToggle={() => setTheme(t => t === "dark" ? "light" : "dark")} />
            </div>
          </header>

          {/* ── TABS ── */}
          <nav style={{
            display: "flex", gap: 2,
            borderBottom: "1px solid var(--border-primary)",
            background: "var(--bg-header)",
            backdropFilter: "var(--backdrop-blur)", WebkitBackdropFilter: "var(--backdrop-blur)",
            paddingLeft: 28, overflowX: "auto",
          }}>
            {TABS.map((t, i) => (
              <button key={t.label} onClick={() => setTab(i)}
                style={{
                  padding: "13px 20px", cursor: "pointer",
                  background: tab === i ? "var(--bg-input)" : "transparent",
                  color: tab === i ? A.green : "var(--text-dim)",
                  fontSize: 11, letterSpacing: "0.07em",
                  fontWeight: tab === i ? 600 : 400,
                  borderBottom: tab === i ? `2px solid ${A.green}` : "2px solid transparent",
                  borderRadius: "10px 10px 0 0",
                  display: "flex", alignItems: "center", gap: 7,
                  transition: "all 0.3s ease", whiteSpace: "nowrap",
                }}>
                <span style={{ fontSize: 14 }}>{t.icon}</span>
                {t.label.toUpperCase()}
              </button>
            ))}
          </nav>

          {/* ── CONTENT ── */}
          <main style={{ padding: "28px 28px", maxWidth: 1020, margin: "0 auto" }}>

            {tab === 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 22, animation: "fadeSlideIn 0.45s ease" }}>
                <div>
                  <SectionLabel icon="📡" text="Batch Sensor Verification" />
                  <Card><IoTForm onResult={setTrustScore} /></Card>
                </div>
                <div>
                  <SectionLabel icon="🔒" text="Trust Score Engine" />
                  <Card>
                    <div style={{ display: "flex", justifyContent: "center", marginBottom: 20 }}>
                      <div style={{ textAlign: "center" }}>
                        <GaugeArc value={trustScore} color={trustScore >= 75 ? A.green : trustScore >= 55 ? A.amber : A.red} size={200} strokeWidth={14} />
                        <div style={{
                          fontSize: 46, fontWeight: 700,
                          color: trustScore >= 75 ? A.green : trustScore >= 55 ? A.amber : A.red,
                          fontFamily: "'JetBrains Mono', monospace", marginTop: -6, transition: "color 0.4s ease",
                        }}>{trustScore}</div>
                        <div style={{ fontSize: 11, color: "var(--text-dim)", fontWeight: 500 }}>/ 100 TRUST SCORE</div>
                        <div style={{ marginTop: 12 }}><StatusBadge value={trustScore} type="trust" /></div>
                      </div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      {[
                        ["Batch ID", `BCH-${(trustScore * 847).toString().slice(-5)}`],
                        ["Processor", "#07 (anon)"],
                        ["Product Type", "Heat-Sensitive Goods"],
                        ["Certified At", new Date().toLocaleTimeString()],
                      ].map(([l,v]) => (
                        <MetricBox key={l} label={l} value={v} color="var(--text-secondary)" />
                      ))}
                    </div>
                  </Card>
                </div>
              </div>
            )}

            {tab === 1 && (
              <div style={{ animation: "fadeSlideIn 0.45s ease" }}>
                <SectionLabel icon="🌡️" text="Microclimate Exposure Risk Model (MERM)" />
                <Card><MicroclimateSimulator trustScore={trustScore} /></Card>
              </div>
            )}

            {tab === 2 && (
              <div style={{ animation: "fadeSlideIn 0.45s ease" }}>
                <SectionLabel icon="📊" text="Climate Demand Intelligence (Prophet ML)" />
                <Card><DemandChart theme={theme} /></Card>
              </div>
            )}

            {tab === 3 && (
              <div style={{ animation: "fadeSlideIn 0.45s ease" }}>
                <SectionLabel icon="🌱" text="Impact & ESG Ledger" />
                <ESGCard trustScore={trustScore} dvs={dvs} />
                <div style={{ marginTop: 20 }}>
                  <Card>
                    <div style={{ fontSize: 12, color: A.green, marginBottom: 14, fontWeight: 700 }}>Monthly Impact Summary</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0 }}>
                      {[
                        ["SMEs Served", "500+"],
                        ["Batches Certified", `${trustScore * 3}`],
                        ["Dispatch Alerts Issued", `${Math.round(dvs * 0.4)}`],
                        ["Circular Economy Value", "BDT 6.3L ARR"],
                      ].map(([l,v]) => (
                        <div key={l} style={{
                          display: "flex", justifyContent: "space-between", padding: "10px 0",
                          borderBottom: "1px solid var(--border-primary)",
                        }}>
                          <span style={{ fontSize: 11, color: "var(--text-dim)" }}>{l}</span>
                          <span style={{ fontSize: 12, color: A.green, fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{v}</span>
                        </div>
                      ))}
                    </div>
                  </Card>
                </div>
              </div>
            )}
          </main>

          {/* ── FOOTER ── */}
          <footer style={{
            borderTop: "1px solid var(--border-primary)",
            padding: "14px 28px",
            display: "flex", justifyContent: "space-between", alignItems: "center",
            background: "var(--bg-header)",
            backdropFilter: "var(--backdrop-blur)", WebkitBackdropFilter: "var(--backdrop-blur)",
          }}>
            <div style={{ fontSize: 9, color: "var(--text-dim)", letterSpacing: "0.12em", fontWeight: 500 }}>
              ECOSORTHA AI CLIMATESHIELD · INFINITY AI BUILDFEST 2026 · TEAM GLIDERS · TRACK 4: E-COMMERCE
            </div>
            <div style={{ display: "flex", gap: 18, fontSize: 9, color: "var(--text-dim)" }}>
              <span>Trust: <span style={{ color: A.green, fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{trustScore}/100</span></span>
              <span>DVS: <span style={{ color: dvs >= 75 ? A.green : dvs >= 55 ? A.amber : A.red, fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{dvs}/100</span></span>
            </div>
          </footer>
        </div>
      );
    }

    /* ── Mount ── */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<EcoSorthaApp />);
  </script>
</body>
</html>
