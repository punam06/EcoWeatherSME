    <script>
      // Global Error Diagnostic Boundary
      window.onerror = function (message, source, lineno, colno, error) {
        if (message === "Script error." && (!source || source === "") && lineno === 0 && colno === 0 && !error) {
          console.warn("[ClimateShield] Suppressed opaque cross-origin Script error (benign).");
          return true; 
        }
        showErrorDiagnostic({ type: "Runtime Error / Compilation Error", message: message, source: source, line: lineno, column: colno, stack: error ? error.stack : "N/A" });
        return false;
      };

      window.addEventListener("unhandledrejection", function (event) {
        showErrorDiagnostic({ type: "Unhandled Promise Rejection", message: event.reason ? event.reason.message || event.reason : "Unknown Promise Rejection", source: "Promise", line: "N/A", column: "N/A", stack: event.reason && event.reason.stack ? event.reason.stack : "N/A" });
      });

      function showErrorDiagnostic(details) {
        if (!document.body) {
          window.addEventListener("DOMContentLoaded", () => showErrorDiagnostic(details));
          return;
        }
        let errorDiv = document.getElementById("error-diagnostic-overlay");
        if (!errorDiv) {
          errorDiv = document.createElement("div");
          errorDiv.id = "error-diagnostic-overlay";
          errorDiv.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:#0F172A;color:#F87171;padding:40px;font-family:monospace;z-index:99999;overflow:auto;box-sizing:border-box;";
          document.body.appendChild(errorDiv);
        }
        errorDiv.innerHTML = `<div style="max-width:900px;margin:0 auto;background:#1E293B;border:2px solid #EF4444;border-radius:12px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,0.5)">
          <h1 style="color:#EF4444;font-size:24px;margin-bottom:20px;border-bottom:1px solid #334155;padding-bottom:10px;">⚠️ CLimaLogix ClimateShield - Diagnostic Error Alert</h1>
          <p style="font-size:16px;color:#F1F5F9;margin-bottom:15px;">An error occurred while loading or compiling the frontend application. Below are the diagnostic details:</p>
          <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px;color:#CBD5E1;">
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;width:120px;border-bottom:1px solid #334155;">Type:</td><td style="padding:8px;border-bottom:1px solid #334155;">${details.type}</td></tr>
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;border-bottom:1px solid #334155;">Message:</td><td style="padding:8px;border-bottom:1px solid #334155;color:#F1F5F9;">${details.message}</td></tr>
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;border-bottom:1px solid #334155;">File:</td><td style="padding:8px;border-bottom:1px solid #334155;">${details.source || "N/A"}</td></tr>
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;border-bottom:1px solid #334155;">Line / Col:</td><td style="padding:8px;border-bottom:1px solid #334155;">${details.line} : ${details.column}</td></tr>
          </table>
          <h3 style="color:#F1F5F9;margin-bottom:10px;">Stack Trace / Context:</h3>
          <pre style="background:#0F172A;color:#94A3B8;padding:15px;border-radius:6px;overflow:auto;max-height:350px;white-space:pre-wrap;font-size:12px;border:1px solid #334155;">${details.stack}</pre>
          <div style="margin-top:20px;text-align:right;">
            <button onclick="window.location.reload()" style="background:#EF4444;color:#FFF;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;cursor:pointer;font-family:inherit;">🔄 Reload Page</button>
          </div>
        </div>`;
      }
    </script>

      @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

      @media (max-width: 900px) {
        body { font-size: 14px; }
        header { flex-direction: column !important; align-items: stretch !important; padding: 16px !important; gap: 16px !important; height: auto !important; }

        main { padding: 16px !important; width: 100% !important; }
        div[style*="grid-template-columns: 1fr 1fr"], div[style*="grid-template-columns: 2fr 1fr"], div[style*="grid-template-columns: 1.2fr 1.8fr"], div[style*="grid-template-columns: 1.2fr 2fr"], div[style*="grid-template-columns: 3fr 1fr"], div[style*="grid-template-columns: repeat(2, 1fr)"], div[style*="grid-template-columns: 240px 1fr"], div[style*="grid-template-columns: 250px 1fr"], div[style*="grid-template-columns: repeat(3, 1fr)"], div[style*="grid-template-columns: repeat(4, 1fr)"] { grid-template-columns: 1fr !important; }
        div[style*="grid-template-columns: repeat(auto-fill"] { grid-template-columns: 1fr !important; }
        div[style*="flex-direction: row"], .stack-mobile { flex-direction: column !important; }
        div[style*="display: grid"][style*="gap: 20px"] { grid-template-columns: 1fr !important; }

        div[style*="padding: 32"] { padding: 16px !important; }
    }

    <!-- React Router v6 UMD (history v5 is bundled internally by this build) -->
    <script crossorigin src="https://unpkg.com/react-router@6.4.5/dist/umd/react-router.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router-dom@6.4.5/dist/umd/react-router-dom.production.min.js"></script>
    <script>
      (function () {
        // react-router-dom v6.4 UMD exposes a single global: ReactRouterDOM.
        // It bundles history@5 internally, so BrowserRouter works without
        // a separate createBrowserHistory global. We just need to surface
        // the named exports as bare globals so JSX/compiled JS that references
        // them without a namespace can resolve them.
        function applyAliases() {
          if (!window.ReactRouterDOM) return false;
          var names = [
            "BrowserRouter", "HashRouter", "MemoryRouter", "Router",
            "Routes", "Route", "Outlet", "Navigate",
            "Link", "NavLink", "useNavigate", "useLocation", "useParams",
            "useMatch", "useRoutes", "useSearchParams"
          ];
          for (var i = 0; i < names.length; i++) {
            var n = names[i];
            if (window.ReactRouterDOM[n] !== undefined && window[n] === undefined) {
              window[n] = window.ReactRouterDOM[n];
            }
          }
          return true;
        }
        if (!applyAliases()) {
          window.addEventListener("load", function () {
            if (!window.ReactRouterDOM) {
              console.error("[ClimateShield] react-router-dom UMD failed to load. window.ReactRouterDOM is undefined.");
            }
          });
        }
      })();
    </script>
