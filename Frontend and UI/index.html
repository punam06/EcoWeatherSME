<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CLimaLogix AI ClimateShield — SME Dashboard for climate-resilient dispatch of heat-sensitive products"
    />
    <title>CLimaLogix AI · ClimateShield Dashboard</title>

    <script>
      // Global Error Diagnostic Boundary
      window.onerror = function (message, source, lineno, colno, error) {
        // Ignore opaque cross-origin "Script error." — these are benign noise
        // from CDN scripts (Chart.js, Supabase, Babel, etc.) that the browser
        // sanitises due to CORS. They carry no useful info and do NOT indicate
        // an actual application failure.
        if (
          message === "Script error." &&
          (!source || source === "") &&
          lineno === 0 &&
          colno === 0 &&
          !error
        ) {
          console.warn("[ClimateShield] Suppressed opaque cross-origin Script error (benign).");
          return true; // swallow it
        }

        showErrorDiagnostic({
          type: "Runtime Error / Compilation Error",
          message: message,
          source: source,
          line: lineno,
          column: colno,
          stack: error ? error.stack : "N/A",
        });
        return false;
      };

      window.addEventListener("unhandledrejection", function (event) {
        showErrorDiagnostic({
          type: "Unhandled Promise Rejection",
          message: event.reason
            ? event.reason.message || event.reason
            : "Unknown Promise Rejection",
          source: "Promise",
          line: "N/A",
          column: "N/A",
          stack:
            event.reason && event.reason.stack ? event.reason.stack : "N/A",
        });
      });

      function showErrorDiagnostic(details) {
        // Ensure document body exists or wait for it
        if (!document.body) {
          window.addEventListener("DOMContentLoaded", () =>
            showErrorDiagnostic(details),
          );
          return;
        }

        let errorDiv = document.getElementById("error-diagnostic-overlay");
        if (!errorDiv) {
          errorDiv = document.createElement("div");
          errorDiv.id = "error-diagnostic-overlay";
          errorDiv.style.cssText =
            "position:fixed;top:0;left:0;width:100%;height:100%;background:#0F172A;color:#F87171;padding:40px;font-family:monospace;z-index:99999;overflow:auto;box-sizing:border-box;";
          document.body.appendChild(errorDiv);
        }

        const isFileProtocol = window.location.protocol === "file:";
        const fileTroubleshootMsg = isFileProtocol
          ? `
        <div style="background:rgba(245, 158, 11, 0.1);border:1px solid rgba(245, 158, 11, 0.3);border-radius:8px;padding:16px;margin-bottom:20px;color:#FBBF24;font-size:13px;line-height:1.6;">
          <strong>💡 Local File Security Restraints Detected (file:// protocol):</strong><br/>
          Your browser strictly blocks local script compilation and cross-origin assets due to CORS security rules when opening index.html directly from disk.<br/><br/>
          <strong>To resolve this instantly:</strong><br/>
          1. Close this window.<br/>
          2. Run <code>npm run dev</code> or <code>python3 -m http.server 3000</code> in your terminal.<br/>
          3. Open <strong><a href="http://localhost:3000" style="color:#34D399;text-decoration:underline;">http://localhost:3000</a></strong> in your browser to view the live dashboard!
        </div>
      `
          : "";

        errorDiv.innerHTML = `
        <div style="max-width:900px;margin:0 auto;background:#1E293B;border:2px solid #EF4444;border-radius:12px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,0.5)">
          <h1 style="color:#EF4444;font-size:24px;margin-bottom:20px;border-bottom:1px solid #334155;padding-bottom:10px;">⚠️ CLimaLogix ClimateShield - Diagnostic Error Alert</h1>
          ${fileTroubleshootMsg}
          <p style="font-size:16px;color:#F1F5F9;margin-bottom:15px;">An error occurred while loading or compiling the frontend application. Below are the diagnostic details:</p>
          <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px;color:#CBD5E1;">
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;width:120px;border-bottom:1px solid #334155;">Type:</td><td style="padding:8px;border-bottom:1px solid #334155;">${details.type}</td></tr>
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;border-bottom:1px solid #334155;">Message:</td><td style="padding:8px;border-bottom:1px solid #334155;color:#F1F5F9;">${details.message}</td></tr>
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;border-bottom:1px solid #334155;">File:</td><td style="padding:8px;border-bottom:1px solid #334155;">${details.source || "N/A"}</td></tr>
            <tr><td style="padding:8px;font-weight:bold;color:#F87171;border-bottom:1px solid #334155;">Line / Col:</td><td style="padding:8px;border-bottom:1px solid #334155;">${details.line} : ${details.column}</td></tr>
          </table>
          <h3 style="color:#F1F5F9;margin-bottom:10px;">Stack Trace / Context:</h3>
          <pre style="background:#0F172A;color:#94A3B8;padding:15px;border-radius:6px;overflow:auto;max-height:350px;white-space:pre-wrap;font-size:12px;border:1px solid #334155;">${details.stack}</pre>
          <div style="margin-top:20px;text-align:right;">
            <button onclick="window.location.reload()" style="background:#EF4444;color:#FFF;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;cursor:pointer;font-family:inherit;">🔄 Reload Page</button>
          </div>
        </div>
      `;
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Chart.js -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

    <!-- API Integration Layer -->
    <script src="./api-integration.js"></script>

    <!-- Supabase -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabaseClient.js"></script>

    <!-- Three.js (for Login 3D background) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React + Babel (browser) -->
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"
    ></script>
    <!-- Babel Standalone removed for optimization -->

    <style>
      select option {
        background: #111827 !important;
        color: #f1f5f9 !important;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection {
        background: rgba(16, 185, 129, 0.3);
        color: #fff;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.5);
      }

      /* ── Range Sliders ── */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: var(--gauge-track);
        border-radius: 6px;
        outline: none;
        height: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.25);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
      }
      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
      }

      /* ── Animations ── */
      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 8px rgba(16, 185, 129, 0.25);
        }
        50% {
          box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* ── Buttons Reset ── */
      button {
        font-family: inherit;
        border: none;
        outline: none;
      }
      button:focus-visible {
        outline: 2px solid #10b981;
        outline-offset: 2px;
      }

      /* ── Mobile Responsiveness ── */
      @media (max-width: 900px) {
        .grid-2col,
        .grid-3col,
        .grid-4col,
        .grid-2fr-1fr,
        .grid-1-2fr-1-8fr,
        .grid-sidebar {
          grid-template-columns: 1fr !important;
        }
        .flex-row-to-col {
          flex-direction: column !important;
        }
        body {
          font-size: 14px;
        }
        header {
          flex-direction: column !important;
          align-items: stretch !important;
          padding: 16px !important;
          gap: 16px !important;
          height: auto !important;
        }
        header > div {
          flex-wrap: wrap !important;
          gap: 12px !important;
          justify-content: center !important;
          text-align: center !important;
        }
        header > div > div {
          justify-content: center !important;
        }
        nav {
          flex-wrap: wrap !important;
          padding: 12px !important;
          gap: 8px !important;
        }
        nav button {
          flex: 1 1 calc(33% - 8px) !important;
          padding: 12px !important;
          font-size: 11px !important;
          justify-content: center !important;
        }
        main {
          padding: 16px !important;
          width: 100% !important;
        }
        /* Force grid layouts to stack on mobile */
        div[style*="grid-template-columns: 1fr 1fr"],
        div[style*="grid-template-columns: 2fr 1fr"],
        div[style*="grid-template-columns: 1.2fr 1.8fr"],
        div[style*="grid-template-columns: 1.2fr 2fr"],
        div[style*="grid-template-columns: 3fr 1fr"],
        div[style*="grid-template-columns: repeat(2, 1fr)"],
        div[style*="grid-template-columns: 240px 1fr"],
        div[style*="grid-template-columns: 250px 1fr"],
        div[style*="grid-template-columns: repeat(3, 1fr)"],
        div[style*="grid-template-columns: repeat(4, 1fr)"] {
          grid-template-columns: 1fr !important;
        }
        div[style*="grid-template-columns: repeat(auto-fill"] {
          grid-template-columns: 1fr !important;
        }
        /* Handle horizontal flex containers that should stack */
        div[style*="flex-direction: row"],
        .stack-mobile {
          flex-direction: column !important;
        }
        /* specific override for main content tab blocks */
        div[style*="display: grid"][style*="gap: 20px"] {
          grid-template-columns: 1fr !important;
        }
        div[style*="display: flex"][style*="gap: 20px"] {
          flex-direction: column !important;
        }
        footer {
          flex-direction: column !important;
          align-items: center !important;
          text-align: center !important;
          gap: 12px !important;
          padding: 16px !important;
        }
        /* Prevent massive gauges or charts overflowing */
        canvas {
          max-width: 100% !important;
          height: auto !important;
        }
        /* Mobile touch target improvements */
        input,
        select,
        button {
          min-height: 44px;
        }
        /* Adjust absolute positioned elements */
        div[style*="position: absolute"] {
          max-width: 90vw !important;
        }
        /* Prevent drawers/floating elements from overflowing */
        div[style*="width: 360"] {
          width: 90vw !important;
          max-width: 360px !important;
        }
        div[style*="width: 420"] {
          width: 100vw !important;
          max-width: 420px !important;
        }
        /* Overwrite padding on small screens for modal/drawer */
        div[style*="padding: 32"] {
          padding: 16px !important;
        }
      }
    </style>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script src="./lang/languageManager.js"></script>
    <script src="./ThreeScene.compiled.js"></script>
    <script src="./AuthPanel.js"></script>
    <script src="./climalogix_dashboard.js"></script>
  </body>
</html>
